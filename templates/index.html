<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>Face Analysis: Age, Gender, Emotion & Wellness</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 28px 14px;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 1100px;
    margin: auto;
    background: #fff;
    padding: 28px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

h1 {
    text-align: center;
    margin: 0 0 6px;
    font-size: 26px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin: 0 0 24px;
}

.layout {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 22px;
}

.panel {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 14px;
    background: #fafafa;
}

.panel h2 {
    margin: 0 0 12px;
    font-size: 17px;
    text-align: center;
}

.stage {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #111;
    border-radius: 8px;
    overflow: hidden;
}

video,
#capturedImage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

video {
    display: none;
}

#capturedImage {
    display: none;
}

.placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aaa;
    text-align: center;
    padding: 20px;
}

.box {
    position: absolute;
    border: 3px solid #2ecc71;
    border-radius: 4px;
    display: none;
    pointer-events: none;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

button,
.upload-label {
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    color: #fff;
    text-align: center;
}

button:hover,
.upload-label:hover {
    opacity: .9;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

#startBtn {
    background: #222;
}

#captureBtn {
    background: #1f7a4d;
}

.upload-label {
    background: #3568a8;
    display: block;
}

#uploadInput {
    display: none;
}

#status {
    text-align: center;
    margin: 12px 0 0;
    font-weight: bold;
    min-height: 22px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.card {
    background: #fff;
    border: 1px solid #e2e2e2;
    border-radius: 8px;
    padding: 10px 12px;
}

.card .k {
    font-size: 12px;
    color: #777;
    text-transform: uppercase;
    letter-spacing: .5px;
}

.card .v {
    font-size: 20px;
    font-weight: bold;
    margin-top: 4px;
}

.card .s {
    font-size: 12px;
    color: #888;
    margin-top: 2px;
}

.tips {
    margin-top: 14px;
}

.tips h3 {
    margin: 0 0 8px;
    font-size: 15px;
}

.tips ul {
    margin: 0;
    padding-left: 20px;
    line-height: 1.6;
    font-size: 14px;
}

canvas {
    display: none;
}

@media (max-width: 820px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .buttons {
        flex-direction: column;
    }
}
</style>

</head>

<body>

<div class="container">

<h1>Face Analysis: Age, Gender, Emotion &amp; Behavioral</h1>



<div class="layout">

<!-- CAMERA / IMAGE PANEL -->

<div class="panel">


<h2>Camera / Image</h2>

<div class="stage" id="stage">

    <video id="video" autoplay playsinline muted></video>

    <img id="capturedImage" alt="Selected image">

    <div class="box" id="box"></div>

    <div class="placeholder" id="placeholder">
        Start camera or upload an image
    </div>

</div>

<div class="buttons">

    <button id="startBtn" onclick="startCamera()">
        Start Camera
    </button>

    <button id="captureBtn" onclick="captureImage()" disabled>
        Capture Image
    </button>

    <label class="upload-label" for="uploadInput">
        Upload Image
    </label>

    <input
        type="file"
        id="uploadInput"
        accept="image/*"
        onchange="uploadImage(event)"
    >

</div>

<p id="status"></p>


</div>

<!-- RESULTS PANEL -->

<div class="panel">


<h2>Results</h2>

<div class="grid">

    <div class="card">
        <div class="k">Age</div>
        <div class="v" id="age">-</div>
    </div>

    <div class="card">
        <div class="k">Gender</div>
        <div class="v" id="gender">-</div>
    </div>

    <div class="card">
        <div class="k">Emotion</div>
        <div class="v" id="emotion">-</div>
        <div class="s" id="econf"></div>
    </div>

    <div class="card">
        <div class="k">Skin type</div>
        <div class="v" id="skin">-</div>
    </div>

    <div class="card" style="grid-column: span 2">
        <div class="k">Behaviour</div>
        <div class="v" id="behavior">-</div>
    </div>

</div>

<div class="tips">

    <h3>Personalised suggestions</h3>

    <ul id="tips">
        <li>Results will appear here.</li>
    </ul>

</div>


</div>

</div>

<canvas id="canvas"></canvas>

</div>

<script>

const $ = (id) => document.getElementById(id);

const video = $("video");
const canvas = $("canvas");
const box = $("box");
const capturedImage = $("capturedImage");

let stream = null;


// =========================================================
// START CAMERA
// =========================================================

async function startCamera() {

    try {

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

            $("status").innerText =
                "Camera is not supported by this browser.";

            return;
        }

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user"
            },
            audio: false
        });

        video.srcObject = stream;

        video.style.display = "block";

        capturedImage.style.display = "none";

        $("placeholder").style.display = "none";

        box.style.display = "none";

        await video.play();

        $("stage").style.aspectRatio =
            video.videoWidth + " / " + video.videoHeight;

        $("startBtn").disabled = true;

        $("captureBtn").disabled = false;

        $("status").innerText =
            "Camera ready. Click Capture Image.";

    }

    catch (e) {

        console.error("Camera error:", e);

        $("status").innerText =
            "Camera could not be opened. Please allow camera permission.";

    }
}


// =========================================================
// CAPTURE IMAGE
// =========================================================

async function captureImage() {

    if (!video.videoWidth || !video.videoHeight) {

        $("status").innerText =
            "Camera is not ready.";

        return;
    }

    try {

        $("status").innerText =
            "Capturing image...";


        // Canvas size
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;


        // Draw current camera frame
        const context = canvas.getContext("2d");

        context.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        // Display captured image
        capturedImage.src =
            canvas.toDataURL("image/jpeg", 0.9);

        capturedImage.style.display = "block";

        video.style.display = "none";

        $("placeholder").style.display = "none";

        box.style.display = "none";


        // Convert image to Blob
        const blob = await new Promise(resolve => {

            canvas.toBlob(
                resolve,
                "image/jpeg",
                0.9
            );

        });


        // Send image to Flask
        const fd = new FormData();

        fd.append(
            "frame",
            blob,
            "captured_image.jpg"
        );


        $("status").innerText =
            "Analysing image...";


        const response = await fetch(
            "/analyze_frame",
            {
                method: "POST",
                body: fd
            }
        );


        const data = await response.json();


        if (data.error === "no_face") {

            $("status").innerText =
                "No face detected. Please capture another image.";

            stopCamera();

            return;
        }


        if (data.error) {

            $("status").innerText =
                data.error;

            stopCamera();

            return;
        }


        show(data);


        $("status").innerText =
            "Image captured and analysed successfully.";


        // Stop camera but keep captured image
        stopCamera(true);

        capturedImage.style.display = "block";

    }

    catch (e) {

        console.error(e);

        $("status").innerText =
            "Could not analyse the captured image.";

    }
}


// =========================================================
// UPLOAD IMAGE
// =========================================================

async function uploadImage(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }


    // Stop camera if it is running
    stopCamera(true);


    // Display selected image immediately
    const reader = new FileReader();

    reader.onload = function(e) {

        capturedImage.src = e.target.result;

        capturedImage.style.display = "block";

        $("placeholder").style.display = "none";

        box.style.display = "none";

    };

    reader.readAsDataURL(file);


    $("status").innerText =
        "Analysing uploaded image...";


    try {

        const fd = new FormData();

        fd.append(
            "frame",
            file,
            file.name
        );


        const response = await fetch(
            "/analyze_frame",
            {
                method: "POST",
                body: fd
            }
        );


        const data = await response.json();


        if (data.error === "no_face") {

            $("status").innerText =
                "No face detected in the uploaded image.";

            return;
        }


        if (data.error) {

            $("status").innerText =
                data.error;

            return;
        }


        show(data);


        $("status").innerText =
            "Image uploaded and analysed successfully.";

    }

    catch (e) {

        console.error(e);

        $("status").innerText =
            "Could not analyse the uploaded image.";

    }
}


// =========================================================
// STOP CAMERA
// =========================================================

function stopCamera(silent = false) {

    if (stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );

        stream = null;
    }

    video.srcObject = null;

    video.style.display = "none";

    $("startBtn").disabled = false;

    $("captureBtn").disabled = true;

    if (!capturedImage.src) {

        $("placeholder").style.display = "flex";
    }

    if (!silent) {

        $("status").innerText =
            "Camera stopped.";
    }
}


// =========================================================
// DISPLAY RESULTS
// =========================================================

function show(d) {

    $("age").innerText =
        d.age;

    $("gender").innerText =
        d.gender;

    $("emotion").innerText =
        d.emotion;

    $("econf").innerText =
        d.emotion_conf
        ? "confidence " + d.emotion_conf + "%"
        : "";

    $("skin").innerText =
        d.skin;

    $("behavior").innerText =
        d.behavior;


    $("tips").innerHTML =
        d.tips
        .map(
            t =>
            "<li>" +
            t.replace(/</g, "&lt;") +
            "</li>"
        )
        .join("");


    // Face bounding box
    const [
        x1,
        y1,
        x2,
        y2
    ] = d.bbox;


    box.style.left =
        (x1 * 100) + "%";

    box.style.top =
        (y1 * 100) + "%";

    box.style.width =
        ((x2 - x1) * 100) + "%";

    box.style.height =
        ((y2 - y1) * 100) + "%";

    box.style.display = "block";
}

</script>

</body>
</html>
